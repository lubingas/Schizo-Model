<svg viewBox="0 0 1120 550" role="img" aria-labelledby="s-title s-desc" xmlns="http://www.w3.org/2000/svg">
<title id="s-title">Structure of the Markov model</title>
<desc id="s-desc">Ten health states. People start in the residual phase on a first-line drug. From the residual phase on the first- or second-line drug they can stop the drug, relapse on it, or switch to the next drug because of side effects or poor response. People who stop can relapse; remission after relapsing off the drug restarts the same drug, and remission after relapsing on the drug moves them to the next drug. The third-line drug is fluphenazine decanoate, which people stay on. Death is possible from every state, at age-specific rates.</desc>
<defs><marker id="s-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a7f"/></marker>
<style>.s-node{fill:#fcfcfb;stroke:#c5ccc8}.s-label{font:600 13.5px "Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1b2a33}.s-sub{font:italic 400 12px "Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#6f7a7f}.s-head{font:600 14px "Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1b2a33}.s-edge{fill:none;stroke:#6f7a7f;stroke-width:1.5}.s-edge-label{font:400 12px "Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#4e5b63}.s-note{font:italic 400 12px "Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#6f7a7f}.s-death{font:700 15px "Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1b2a33}.s-frame{fill:none;stroke:#c5ccc8;stroke-width:1.2;stroke-dasharray:6 5}</style></defs>
<rect width="1120" height="550" fill="#ffffff" class="s-bg"/>
<circle cx="26" cy="24" r="6" fill="#4e5b63"/><text x="38" y="29" class="s-head">First-line drug</text><circle cx="446" cy="24" r="6" fill="#4e5b63"/><text x="458" y="29" class="s-head">Second-line drug</text><circle cx="866" cy="24" r="6" fill="#4e5b63"/><text x="878" y="29" class="s-head">Third line: fluphenazine decanoate</text>
<rect x="6" y="44" width="1108" height="400" rx="14" class="s-frame"/>
<rect x="20" y="64" width="120" height="70" rx="10" class="s-node"/><rect x="28" y="74" width="5" height="50" rx="2.5" fill="#c5ccc8"/><text x="40" y="96" class="s-label">Stopped</text><text x="40" y="112" class="s-label">the drug</text><rect x="220" y="64" width="120" height="70" rx="10" class="s-node"/><rect x="228" y="74" width="5" height="50" rx="2.5" fill="#7d8a90"/><text x="240" y="88" class="s-label">Relapse after</text><text x="240" y="104" class="s-label">stopping</text><text x="240" y="120" class="s-sub">in hospital</text><rect x="20" y="220" width="320" height="56" rx="10" class="s-node"/><rect x="28" y="230" width="5" height="36" rx="2.5" fill="#4e5b63"/><text x="40" y="253" class="s-label">Residual phase, on the drug</text><rect x="220" y="360" width="120" height="70" rx="10" class="s-node"/><rect x="228" y="370" width="5" height="50" rx="2.5" fill="#7d8a90"/><text x="240" y="384" class="s-label">Relapse on</text><text x="240" y="400" class="s-label">the drug</text><text x="240" y="416" class="s-sub">in hospital</text><path d="M80,220 V136" class="s-edge" marker-end="url(#s-arrow)"/><path d="M140,99 H218" class="s-edge" marker-end="url(#s-arrow)"/><path d="M280,134 V218" class="s-edge" marker-end="url(#s-arrow)"/><path d="M280,276 V358" class="s-edge" marker-end="url(#s-arrow)"/><path d="M340,395 H490 V278" class="s-edge" marker-end="url(#s-arrow)"/><path d="M340,240 H438" class="s-edge" marker-end="url(#s-arrow)"/><text x="88" y="182" class="s-edge-label" text-anchor="start">stops for other reasons</text><text x="180" y="91" class="s-edge-label" text-anchor="middle">relapses</text><text x="288" y="172" class="s-edge-label" text-anchor="start">remission,</text><text x="288" y="186" class="s-edge-label" text-anchor="start">restarts the drug</text><text x="288" y="322" class="s-edge-label" text-anchor="start">relapses</text><text x="346" y="417" class="s-edge-label" text-anchor="start">remission, switches drug</text><text x="390" y="262" class="s-edge-label" text-anchor="middle">side effects or</text><text x="390" y="276" class="s-edge-label" text-anchor="middle">poor response</text>
