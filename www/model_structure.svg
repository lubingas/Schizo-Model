-label" text-anchor="middle">relapses</text><text x="708" y="198" class="s-edge-label" text-anchor="start">remission,</text><text x="708" y="212" class="s-edge-label" text-anchor="start">restarts the drug</text><text x="708" y="356" class="s-edge-label" text-anchor="start">relapses</text><text x="766" y="457" class="s-edge-label" text-anchor="start">remission, switches drug</text><text x="810" y="256" class="s-edge-label" text-anchor="middle">side effects</text><text x="810" y="310" class="s-edge-label" text-anchor="middle">lack of</text><text x="810" y="324" class="s-edge-label" text-anchor="middle">efficacy</text>
