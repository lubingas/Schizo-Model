<svg viewBox="0 0 1200 620" role="img" aria-labelledby="s-title s-desc" xmlns="http://www.w3.org/2000/svg">
<title id="s-title">Structure of the Markov model</title>
<desc id="s-desc">Ten health states. Each year patients stay in their state or move to another. Patients start in the residual phase on a first-line drug. From the residual phase on the first- or second-line drug they can stop the drug for other reasons, relapse on it, or switch to the next drug because of side effects or lack of efficacy. Patients who stop can relapse; remission after relapsing off the drug restarts the same drug, and remission after relapsing on the drug moves them to the next drug. The third-line drug is fluphenazine decanoate, which patients stay on. Death is possible from every state, at age-specific rates.</desc>
<defs><marker id="s-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6f7a7f"/></marker>
<style>.s-node{fill:#fcfcfb;stroke:#c5ccc8}.s-label{font:600 13.5px "Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1b2a33}.s-sub{font:italic 400 12px "Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#6f7a7f}.s-head{font:600 14px "Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1b2a33}.s-edge{fill:none;stroke:#6f7a7f;stroke-width:1.5}.s-edge-label{font:400 12px "Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#4e5b63}.s-note{font:italic 400 12px "Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#6f7a7f}.s-death{font:700 15px "Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1b2a33}.s-start{font:600 13.5px "Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#1b2a33}.s-frame{fill:none;stroke:#c5ccc8;stroke-width:1.2;stroke-dasharray:6 5}</style></defs>
