-edge-label" text-anchor="middle">side effects or</text><text x="810" y="276" class="s-edge-label" text-anchor="middle">poor response</text>
<rect x="860" y="220" width="240" height="56" rx="10" class="s-node"/><rect x="868" y="230" width="5" height="36" rx="2.5" fill="#4e5b63"/><text x="880" y="253" class="s-label">Residual phase, on the drug</text><text x="980" y="300" class="s-note" text-anchor="middle">stays on this drug</text>
<path d="M560,444 V486" class="s-edge" marker-end="url(#s-arrow)"/><text x="572" y="470" class="s-edge-label" text-anchor="start">dies, from every state, at age-specific rates</text><rect x="480" y="488" width="160" height="48" rx="10" fill="#e9ede9" stroke="#c5ccc8"/><text x="560" y="517" class="s-death" text-anchor="middle">Death</text>
</svg>
